apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-portal

spec:
  replicas: 3

  selector:
    matchLabels:
      app: department-portal

  template:
    metadata:
      labels:
        app: department-portal

    spec:
      containers:
        - name: department-portal
          image: abhijith006/department-information-portal:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: department-portal-service

spec:
  type: NodePort

  selector:
    app: department-portal

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
